<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급식 알레르기 학생 관리 앱</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
    h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
    
    /* 네비게이션 버튼 */
    .nav-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .nav-btn { width: auto; padding: 10px 24px; font-size: 16px; font-weight: bold; background-color: #7f8c8d; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .nav-btn.active { background-color: #2c3e50; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
    .nav-btn:hover { opacity: 0.9; }

    /* 페이지 세션 */
    .page { display: none; max-width: 800px; margin: 0 auto; }
    .page.active { display: block; }

    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
    form div { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #34495e; }
    input, select, button, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button.submit-btn { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button.submit-btn:hover { background-color: #2980b9; }

    /* 스크롤형 학생 리스트 */
    .filter-container { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
    .filter-container select { width: 130px; }
    
    .scroll-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; background: #fafafa; }
    .student-card { border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; border-radius: 6px; background: #fff; transition: all 0.3s ease; }
    
    /* 빨간색 강조 표시 */
    .student-card.highlight-red { background-color: #ffe6e6 !important; border: 2px solid #e74c3c !important; color: #c0392b !important; font-weight: bold; }
    .warning-tag { color: #e74c3c; font-weight: bold; margin-top: 5px; display: inline-block; }

    /* 텍스트 입력 분석 영역 */
    textarea { resize: vertical; }
  </style>
</head>
<body>

  <h1>🏫 급식 식단 & 알레르기 학생 관리 시스템</h1>

  <!-- 페이지 이동 버튼 -->
  <div class="nav-container">
    <button class="nav-btn active" onclick="switchPage('registerPage', this)">학생 등록 페이지</button>
    <button class="nav-btn" onclick="switchPage('listPage', this)">학생 리스트 & 급식 분석</button>
  </div>

  <!-- 1. 학생 정보 입력 페이지 -->
  <div id="registerPage" class="page active">
    <div class="card">
      <h2>📝 학생 정보 등록</h2>
      <form id="studentForm">
        <div>
          <label>학년 / 반 / 번호</label>
          <div style="display: flex; gap: 10px;">
            <input type="number" id="grade" placeholder="학년" required min="1">
            <input type="number" id="classNum" placeholder="반" required min="1">
            <input type="number" id="studentNum" placeholder="번호" required min="1">
          </div>
        </div>
        <div>
          <label>이름</label>
          <input type="text" id="name" placeholder="학생 이름" required>
        </div>
        <div>
          <label>유형</label>
          <select id="type">
            <option value="알레르기">알레르기</option>
            <option value="종교">종교</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div>
          <label>못 먹는 식품 번호 (알레르기 유발식품 1~19번, 쉼표로 구분)</label>
          <input type="text" id="restrictedFoods" placeholder="예: 1, 5, 12">
        </div>
        <button type="submit" class="submit-btn">학생 등록</button>
      </form>
    </div>
  </div>

  <!-- 2. 학년/반별 스크롤 리스트 및 급식 텍스트 분석 페이지 -->
  <div id="listPage" class="page">
    <div class="card">
      <h2>📋 학년 및 반별 학생 리스트</h2>
      
      <!-- 조회 필터 -->
      <div class="filter-container">
        <label style="margin: 0; width: auto;">필터 선택:</label>
        <select id="filterGrade" onchange="renderStudents()">
          <option value="all">전체 학년</option>
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
        </select>
        <select id="filterClass" onchange="renderStudents()">
          <option value="all">전체 반</option>
          <option value="1">1반</option>
          <option value="2">2반</option>
          <option value="3">3반</option>
        </select>
      </div>

      <!-- 스크롤형 리스트 -->
      <div id="studentList" class="scroll-list"></div>
    </div>

    <!-- 리스트 아래 텍스트 입력 박스 (AI 분석) -->
    <div class="card">
      <h2>🍲 오늘의 급식 메뉴 입력 (AI 분석)</h2>
      <textarea id="menuTextInput" rows="4" placeholder="오늘의 급식 메뉴 텍스트를 입력해 주세요. (예: 현미밥, 쇠고기미역국(16), 제육볶음(5,10), 포도)"></textarea>
      <button onclick="analyzeText()" class="submit-btn" style="background-color: #27ae60;">급식 메뉴 AI 분석 실행</button>
      
      <div id="status" style="margin-top: 12px; font-weight: bold;"></div>
      <div id="detectedInfo" style="margin-top: 8px;"></div>
    </div>
  </div>

  <script>
    let students = [];
    let activeFoodNumbers = []; // AI가 인식한 오늘 급식의 알레르기 번호들

    // 페이지 전환 함수
    function switchPage(pageId, btnElement) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(pageId).classList.add('active');
      btnElement.classList.add('active');

      if (pageId === 'listPage') {
        renderStudents();
      }
    }

    // 학생 등록 처리
    document.getElementById('studentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const grade = document.getElementById('grade').value;
      const classNum = document.getElementById('classNum').value;
      const studentNum = document.getElementById('studentNum').value;
      const name = document.getElementById('name').value;
      const type = document.getElementById('type').value;
      
      const rawFoods = document.getElementById('restrictedFoods').value;
      const restrictedFoods = rawFoods.split(',')
        .map(n => parseInt(n.trim()))
        .filter(n => !isNaN(n));

      students.push({ grade, classNum, studentNum, name, type, restrictedFoods });
      
      alert('학생이 등록되었습니다.');
      document.getElementById('studentForm').reset();
    });

    // 스크롤형 학생 목록 렌더링
    function renderStudents() {
      const listDiv = document.getElementById('studentList');
      const selectedGrade = document.getElementById('filterGrade').value;
      const selectedClass = document.getElementById('filterClass').value;

      listDiv.innerHTML = '';

      const filtered = students.filter(s => {
        const matchGrade = selectedGrade === 'all' || s.grade === selectedGrade;
        const matchClass = selectedClass === 'all' || s.classNum === selectedClass;
        return matchGrade && matchClass;
      });

      if (filtered.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center; color:#888;">등록된 학생이 없거나 해당 학년/반에 일치하는 학생이 없습니다.</p>';
        return;
      }

      filtered.forEach(s => {
        // AI가 인식한 알레르기 번호 중 학생이 못 먹는 번호가 포함되어 있는지 확인
        const hasConflict = s.restrictedFoods.some(num => activeFoodNumbers.includes(num));

        const card = document.createElement('div');
        // 충돌 발생 시 빨간색 강조 클래스(highlight-red) 적용
        card.className = `student-card ${hasConflict ? 'highlight-red' : ''}`;
        
        card.innerHTML = `
          <strong>[${s.grade}학년 ${s.classNum}반 ${s.studentNum}번] ${s.name}</strong> 
          <span>(${s.type})</span>
          <br>
          <small style="color: #666;">제한 식품 번호: ${s.restrictedFoods.length > 0 ? s.restrictedFoods.join(', ') : '없음'}</small>
          ${hasConflict ? '<br><span class="warning-tag">⚠️ 오늘 급식 주의 대상 학생!</span>' : ''}
        `;
        listDiv.appendChild(card);
      });
    }

    // 급식표 텍스트 AI 분석 함수
    async function analyzeText() {
      const menuText = document.getElementById('menuTextInput').value.trim();
      const statusDiv = document.getElementById('status');
      const detectedDiv = document.getElementById('detectedInfo');

      if (!menuText) {
        alert('급식 메뉴 텍스트를 입력해 주세요.');
        return;
      }

      statusDiv.style.color = '#333';
      statusDiv.innerText = 'AI 분석 중... 잠시만 기다려 주세요.';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ menuText })
        });

        const data = await response.json();

        if (response.ok) {
          activeFoodNumbers = data.numbers || [];
          statusDiv.style.color = '#27ae60';
          statusDiv.innerText = '분석 완료!';
          detectedDiv.innerHTML = `<strong>오늘 급식 추출 알레르기 번호:</strong> [${activeFoodNumbers.join(', ')}]`;
          // 리스트 즉시 갱신 (빨간색 강조 반영)
          renderStudents();
        } else {
          statusDiv.style.color = '#e74c3c';
          statusDiv.innerText = '오류 발생: ' + (data.error || '알 수 없는 오류');
        }
      } catch (err) {
        console.error(err);
        statusDiv.style.color = '#e74c3c';
        statusDiv.innerText = '분석 중 에러가 발생했습니다.';
      }
    }
  </script>
</body>
</html>
